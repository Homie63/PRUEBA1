<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio - Editor de Video</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Menú flotante estilo cápsula -->
    <nav class="navbar-flotante">
        <a href="#inicio" class="active">Inicio</a>
        <a href="#clientes">Clientes</a>
        <a href="#trabajos">Mis trabajos</a>
        <a href="#contacto" class="btn-destacado">Contacto</a>
    </nav>

    <!-- Sección de Inicio (Video Fullscreen) -->
    <section id="inicio" class="hero-section">
        <!-- Reemplaza 'tu-video.mp4' con la ruta de tu video o usa una etiqueta de Vimeo/YouTube -->
        <video autoplay muted loop id="video-fondo">
            <source src="https://assets.mixkit.co/videos/preview/mixkit-set-of-plateaus-seen-from-the-sky-in-a-sunset-26070-large.mp4" type="video/mp4">
        </video>

        <!-- Tarjeta destacada en el centro -->
        <div class="tarjeta-hero">
            <iframe width="100%" height="100%" src="https://www.youtube.com/embed/dQw4w9WgXcQ" frameborder="0" allowfullscreen></iframe>
        </div>
    </section>

    <!-- Sección de Presentación (al hacer scroll hacia abajo) -->
    <section id="presentacion" class="seccion-presentacion">
        <h2>Hola, soy [Tu Nombre]</h2>
        <p>Editor de video especializado en contenido dinámico, postproducción y efectos visuales.</p>
    </section>

</body>
</html>
